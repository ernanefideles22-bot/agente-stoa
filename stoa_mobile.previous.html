<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>STOA Mobile</title>
<style>
:root{
  --bg:#02060b;
  --cyan:#6fe7ff;
  --cyan-2:#18cfff;
  --cyan-3:rgba(111,231,255,.25);
  --text:#dff9ff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}
body{touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none}
#topbar{
  position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 14px;gap:12px;pointer-events:none
}
#meta,#device,#status{
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(223,249,255,.48)
}
#status{position:absolute;top:max(44px,calc(env(safe-area-inset-top) + 32px));left:50%;transform:translateX(-50%)}
#hint{
  position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));
  transform:translateX(-50%);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(223,249,255,.36);text-align:center;max-width:84vw
}
#reply{
  position:absolute;left:50%;bottom:max(54px,calc(env(safe-area-inset-bottom) + 34px));
  transform:translateX(-50%);width:min(560px,88vw);
  text-align:center;font-size:16px;line-height:1.45;color:rgba(223,249,255,.94);
  text-shadow:0 0 18px rgba(24,207,255,.28)
}
#share{
  pointer-events:auto;position:absolute;top:max(12px,env(safe-area-inset-top));left:14px;
  border:1px solid rgba(111,231,255,.45);background:rgba(3,12,19,.7);color:var(--text);
  border-radius:8px;padding:10px 12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  display:none
}
#setup,#qr{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(1,5,9,.94);z-index:20;padding:20px
}
#setup.hidden,#qr.hidden{display:none}
.panel{
  width:min(420px,92vw);background:rgba(5,14,22,.92);border:1px solid rgba(111,231,255,.18);
  border-radius:8px;padding:18px;display:grid;gap:12px;box-shadow:0 16px 48px rgba(0,0,0,.45)
}
.title{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:rgba(223,249,255,.8)}
.sub{font-size:14px;color:rgba(223,249,255,.66);line-height:1.4}
input,button{
  width:100%;border-radius:8px;border:1px solid rgba(111,231,255,.24);background:#07111a;color:var(--text);
  padding:12px 14px;font:inherit
}
button{cursor:pointer;background:linear-gradient(180deg,#0a2530,#081722)}
#qrbox{display:grid;gap:12px;justify-items:center}
#qrbox canvas,#qrbox img{position:static;width:220px;height:220px}
#qrurl{font-size:12px;line-height:1.4;color:rgba(223,249,255,.72);word-break:break-all;text-align:center}
@media (max-width: 720px){
  #device,#share{display:none!important}
  #reply{font-size:15px;width:86vw}
  #hint{font-size:11px}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="ui">
  <button id="share" type="button">QR Mobile</button>
  <div id="topbar">
    <div id="meta"></div>
    <div id="device"></div>
  </div>
  <div id="status"></div>
  <div id="reply"></div>
  <div id="hint">toque no centro para falar</div>
</div>

<div id="setup">
  <div class="panel">
    <div class="title">STOA Mobile</div>
    <div class="sub">Abra pelo link completo ou preencha os dados manualmente.</div>
    <input id="inp-api" type="url" placeholder="https://xxxx.trycloudflare.com" autocomplete="off">
    <input id="inp-token" type="password" placeholder="STOA_ACCESS_TOKEN" autocomplete="off">
    <input id="inp-session" type="text" placeholder="stoa-shared" autocomplete="off">
    <button id="connect" type="button">Conectar</button>
  </div>
</div>

<div id="qr" class="hidden">
  <div class="panel" id="qrbox">
    <div class="title">Abrir no mobile</div>
    <img id="qrimg" alt="QR code">
    <div id="qrurl"></div>
    <button id="qrclose" type="button">Fechar</button>
  </div>
</div>

<script>
const scene = document.getElementById("scene");
const ctx = scene.getContext("2d");
const setup = document.getElementById("setup");
const qr = document.getElementById("qr");
const qrimg = document.getElementById("qrimg");
const qrurl = document.getElementById("qrurl");
const meta = document.getElementById("meta");
const device = document.getElementById("device");
const statusEl = document.getElementById("status");
const replyEl = document.getElementById("reply");
const hintEl = document.getElementById("hint");
const shareBtn = document.getElementById("share");
const connectBtn = document.getElementById("connect");
const qrCloseBtn = document.getElementById("qrclose");
const inpApi = document.getElementById("inp-api");
const inpToken = document.getElementById("inp-token");
const inpSession = document.getElementById("inp-session");

const params = new URLSearchParams(location.search);
const IS_MOBILE = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

let API_BASE = "http://127.0.0.1:18000";
let ACCESS_TOKEN = "";
let SESSION_ID = "stoa-shared";
let state = "idle";
let blink = 1;
let blinkTarget = 1;
let nextBlinkAt = 0;
let speakingLevel = 0;
let thinkingPhase = 0;
let pulse = 0;
let femaleVoice = null;
let recognition = null;

function loadConfig() {
  const stored = JSON.parse(sessionStorage.getItem("stoa_mobile_cfg") || "{}");
  if (params.get("api")) API_BASE = params.get("api").replace(/\/$/, "");
  else if (stored.api) API_BASE = stored.api;
  if (params.get("token")) ACCESS_TOKEN = params.get("token");
  else if (stored.token) ACCESS_TOKEN = stored.token;
  if (params.get("session")) SESSION_ID = params.get("session");
  else if (stored.session) SESSION_ID = stored.session;
  meta.textContent = `session ${SESSION_ID}`;
  device.textContent = IS_MOBILE ? "mobile" : "desktop";
  shareBtn.style.display = IS_MOBILE ? "none" : "block";
  if (ACCESS_TOKEN) setup.classList.add("hidden");
}

function saveConfig() {
  sessionStorage.setItem("stoa_mobile_cfg", JSON.stringify({
    api: API_BASE, token: ACCESS_TOKEN, session: SESSION_ID
  }));
  meta.textContent = `session ${SESSION_ID}`;
}

function setState(next) {
  state = next;
  const labels = {
    idle: "",
    listening: "ouvindo",
    thinking: "processando",
    speaking: "respondendo"
  };
  statusEl.textContent = labels[next] || "";
  hintEl.textContent = next === "idle" ? "toque no centro para falar" : "toque novamente para parar";
}

function setReply(text) {
  replyEl.textContent = text || "";
}

function resize() {
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  scene.width = Math.floor(innerWidth * dpr);
  scene.height = Math.floor(innerHeight * dpr);
  scene.style.width = `${innerWidth}px`;
  scene.style.height = `${innerHeight}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function scheduleBlink(now) {
  if (now >= nextBlinkAt) {
    blinkTarget = 0.02;
    nextBlinkAt = now + 2400 + Math.random() * 3200;
    setTimeout(() => { blinkTarget = 1; }, 120);
  }
}

function circleGlow(x, y, r, color, alpha) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color.replace("ALPHA", alpha));
  g.addColorStop(1, color.replace("ALPHA", 0));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}

function roundedRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBackground(now) {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  const bg = ctx.createLinearGradient(0, 0, 0, innerHeight);
  bg.addColorStop(0, "#02060b");
  bg.addColorStop(.6, "#030911");
  bg.addColorStop(1, "#010308");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  const count = Math.floor(Math.min(180, innerWidth * innerHeight / 9000));
  for (let i = 0; i < count; i++) {
    const seed = i * 9973;
    const x = (seed * 17 % 1000) / 1000 * innerWidth;
    const y = ((seed * 29 + 131) % 1000) / 1000 * innerHeight;
    const tw = .2 + .8 * Math.abs(Math.sin(now * .0008 + i));
    ctx.fillStyle = `rgba(130,220,255,${0.06 + tw * 0.4})`;
    ctx.fillRect(x, y, 1.5, 1.5);
  }
}

function drawEntity(now) {
  const cx = innerWidth / 2;
  const cy = innerHeight * 0.46;
  const scale = Math.min(innerWidth * 0.26, innerHeight * 0.24);
  const aura = state === "listening" ? 1.1 : state === "thinking" ? .85 : state === "speaking" ? 1 : .7;
  pulse += ((state === "listening" ? 1 : state === "speaking" ? .85 : .45) - pulse) * 0.08;
  speakingLevel += (((state === "speaking") ? (.35 + Math.abs(Math.sin(now * .024)) * .65) : 0) - speakingLevel) * 0.18;
  thinkingPhase += state === "thinking" ? 0.045 : 0.015;
  blink += (blinkTarget - blink) * 0.28;
  scheduleBlink(now);

  circleGlow(cx, cy, scale * 1.65, "rgba(24,207,255,ALPHA)", 0.08 + aura * 0.08);
  circleGlow(cx, cy + scale * .25, scale * 1.1, "rgba(111,231,255,ALPHA)", 0.04 + pulse * 0.05);

  ctx.save();
  ctx.translate(cx, cy);

  const face = ctx.createLinearGradient(0, -scale * 1.1, 0, scale * 1.4);
  face.addColorStop(0, "rgba(18,30,46,.92)");
  face.addColorStop(.35, "rgba(30,57,83,.98)");
  face.addColorStop(1, "rgba(8,16,24,.98)");
  ctx.fillStyle = face;
  ctx.strokeStyle = "rgba(111,231,255,.2)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, -scale * 1.18);
  ctx.bezierCurveTo(scale * .62, -scale * .92, scale * .92, -scale * .18, scale * .7, scale * .62);
  ctx.bezierCurveTo(scale * .44, scale * 1.1, scale * .12, scale * 1.36, 0, scale * 1.48);
  ctx.bezierCurveTo(-scale * .12, scale * 1.36, -scale * .44, scale * 1.1, -scale * .7, scale * .62);
  ctx.bezierCurveTo(-scale * .92, -scale * .18, -scale * .62, -scale * .92, 0, -scale * 1.18);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.strokeStyle = "rgba(111,231,255,.18)";
  ctx.lineWidth = 1;
  for (const offset of [-.55, -.3, .3, .55]) {
    ctx.beginPath();
    ctx.moveTo(scale * offset, -scale * .68);
    ctx.quadraticCurveTo(scale * offset * .75, scale * .12, scale * offset * .55, scale * .95);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(0, -scale * 1.34);
  ctx.lineTo(0, scale * 1.75);
  ctx.strokeStyle = "rgba(111,231,255,.28)";
  ctx.stroke();

  function drawEye(side) {
    const ex = side * scale * .34;
    const ey = -scale * .18;
    const ew = scale * .28;
    const eh = scale * .1 * blink;
    ctx.save();
    ctx.translate(ex, ey);
    ctx.beginPath();
    ctx.moveTo(-ew, 0);
    ctx.quadraticCurveTo(0, -scale * .13 * blink, ew, 0);
    ctx.quadraticCurveTo(0, scale * .08 * blink, -ew, 0);
    ctx.closePath();
    ctx.fillStyle = "rgba(185,248,255,.96)";
    ctx.shadowColor = "rgba(24,207,255,.9)";
    ctx.shadowBlur = 22;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(24,207,255,.92)";
    ctx.beginPath();
    ctx.ellipse(0, 0, ew * .42, Math.max(1, eh * .55), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  drawEye(-1);
  drawEye(1);

  const mouthOpen = state === "speaking" ? scale * (.015 + speakingLevel * .085) : state === "thinking" ? scale * .018 : scale * .008;
  ctx.strokeStyle = "rgba(111,231,255,.72)";
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(-scale * .13, scale * .38);
  ctx.quadraticCurveTo(0, scale * (.42 + mouthOpen), scale * .13, scale * .38);
  ctx.stroke();

  const crystalY = -scale * .68;
  const crystalPulse = .85 + pulse * .45 + Math.abs(Math.sin(now * .0032)) * .18;
  ctx.save();
  ctx.translate(0, crystalY);
  ctx.scale(crystalPulse, crystalPulse);
  ctx.beginPath();
  ctx.moveTo(0, -scale * .14);
  ctx.lineTo(scale * .1, 0);
  ctx.lineTo(0, scale * .18);
  ctx.lineTo(-scale * .1, 0);
  ctx.closePath();
  ctx.fillStyle = "rgba(214,252,255,.96)";
  ctx.shadowColor = "rgba(24,207,255,.95)";
  ctx.shadowBlur = 26;
  ctx.fill();
  ctx.restore();

  for (const side of [-1, 1]) {
    ctx.strokeStyle = "rgba(111,231,255,.24)";
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(side * scale * .72, -scale * .52);
    ctx.lineTo(side * scale * 1.05, -scale * .88);
    ctx.lineTo(side * scale * .8, -scale * .16);
    ctx.stroke();
  }

  if (state === "listening") {
    ctx.strokeStyle = "rgba(111,231,255,.85)";
    ctx.lineWidth = 2;
    const ry = (Math.sin(now * .007) * .5 + .5) * scale * .9 - scale * .45;
    ctx.beginPath();
    ctx.moveTo(-scale * .95, ry);
    ctx.lineTo(scale * .95, ry);
    ctx.stroke();
  }

  if (state === "thinking") {
    for (let i = 0; i < 3; i++) {
      const a = thinkingPhase + i * 2.1;
      circleGlow(Math.cos(a) * scale * .98, -scale * .24 + Math.sin(a * 1.4) * scale * .54, scale * .08, "rgba(111,231,255,ALPHA)", 0.18);
    }
  }

  ctx.restore();
}

function render(now) {
  drawBackground(now);
  drawEntity(now);
  requestAnimationFrame(render);
}

function chooseFemaleVoice() {
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  const pt = voices.filter(v => /pt-BR|pt_BR|pt-BR/i.test(v.lang) || /portuguese|brazil/i.test(`${v.name} ${v.lang}`));
  const ranked = pt.sort((a, b) => scoreVoice(b) - scoreVoice(a));
  return ranked[0] || pt[0] || voices[0];
}

function scoreVoice(v) {
  const hay = `${v.name} ${v.voiceURI} ${v.lang}`.toLowerCase();
  let score = 0;
  if (hay.includes("pt-br")) score += 5;
  if (hay.includes("female")) score += 4;
  if (hay.includes("mulher")) score += 4;
  if (hay.includes("luciana")) score += 4;
  if (hay.includes("maria")) score += 2;
  if (hay.includes("google")) score += 1;
  if (hay.includes("brazil")) score += 2;
  return score;
}

function speak(text) {
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  femaleVoice = chooseFemaleVoice();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "pt-BR";
  utter.rate = 0.97;
  utter.pitch = 1.03;
  if (femaleVoice) utter.voice = femaleVoice;
  utter.onstart = () => setState("speaking");
  utter.onend = () => setState("idle");
  utter.onerror = () => setState("idle");
  speechSynthesis.speak(utter);
}

async function sendCommand(text) {
  const command = (text || "").trim();
  if (!command) return;
  setReply("");
  setState("thinking");
  try {
    const res = await fetch(`${API_BASE}/api/orchestrate`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${ACCESS_TOKEN}`
      },
      body: JSON.stringify({ command, session_id: SESSION_ID })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const payload = await res.json();
    const reply = payload.result || payload.response || payload.output || payload.message || "Sem resposta.";
    setReply(reply);
    speak(reply);
  } catch (err) {
    const msg = "Falha ao falar com o backend. Verifique túnel, token e backend.";
    setReply(msg);
    speak(msg);
  }
}

function stopListening() {
  if (recognition) {
    recognition.onend = null;
    recognition.abort();
    recognition = null;
  }
  setState("idle");
}

function startListening() {
  if (setup.classList.contains("hidden") === false) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setReply("Reconhecimento de voz não disponível neste navegador.");
    return;
  }
  stopListening();
  recognition = new SR();
  recognition.lang = "pt-BR";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.onstart = () => setState("listening");
  recognition.onerror = () => setState("idle");
  recognition.onend = () => {
    if (state === "listening") setState("idle");
    recognition = null;
  };
  recognition.onresult = (event) => {
    const text = event.results?.[0]?.[0]?.transcript || "";
    sendCommand(text);
  };
  recognition.start();
}

function handleTap(x, y) {
  const cx = innerWidth / 2;
  const cy = innerHeight * 0.46;
  const dx = x - cx;
  const dy = y - cy;
  const radius = Math.min(innerWidth * 0.24, innerHeight * 0.24) * 1.35;
  if ((dx * dx + dy * dy) > radius * radius) return;
  if (state === "listening") stopListening();
  else if (state === "idle") startListening();
}

async function showShareQr() {
  const shareUrl = `${API_BASE}/static/stoa_mobile.html?api=${encodeURIComponent(API_BASE)}&token=${encodeURIComponent(ACCESS_TOKEN)}&session=${encodeURIComponent(SESSION_ID)}`;
  qrurl.textContent = shareUrl;
  qrimg.src = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(shareUrl)}`;
  qr.classList.remove("hidden");
}

connectBtn.addEventListener("click", () => {
  const token = inpToken.value.trim();
  if (!token) return;
  API_BASE = (inpApi.value.trim() || API_BASE || "http://127.0.0.1:18000").replace(/\/$/, "");
  ACCESS_TOKEN = token;
  SESSION_ID = inpSession.value.trim() || "stoa-shared";
  saveConfig();
  setup.classList.add("hidden");
});

shareBtn.addEventListener("click", showShareQr);
qrCloseBtn.addEventListener("click", () => qr.classList.add("hidden"));

window.addEventListener("pointerdown", (event) => {
  if (!setup.classList.contains("hidden")) return;
  if (event.target === shareBtn) return;
  handleTap(event.clientX, event.clientY);
});

window.addEventListener("keydown", (event) => {
  if (event.code === "Space") {
    event.preventDefault();
    if (state === "idle") startListening();
    else if (state === "listening") stopListening();
  }
});

window.addEventListener("resize", resize);
if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = () => { femaleVoice = chooseFemaleVoice(); };
}

loadConfig();
resize();
requestAnimationFrame(render);
</script>
</body>
</html>
