server {
    listen 80;
    server_name stoaia.com.br www.stoaia.com.br;

    # Certbot vai substituir este bloco pelo redirect HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name stoaia.com.br www.stoaia.com.br;

    # Certificados gerados pelo Certbot
    ssl_certificate     /etc/letsencrypt/live/stoaia.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stoaia.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Segurança
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Proxy para o app
    location / {
        proxy_pass         http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket
    location /ws {
        proxy_pass         http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }
}
