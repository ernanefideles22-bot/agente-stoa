services:
  stoa-agent:
    build:
      context: .
      dockerfile: Dockerfile.safe
    container_name: safe-stoa-agent
    env_file:
      - ./.env.safe
    ports:
      - "127.0.0.1:${HOST_PORT:-18000}:8000"
    volumes:
      - stoa-data:/app/data
      - stoa-logs:/app/logs
      - stoa-workspace:/app/workspace
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  stoa-data:
  stoa-logs:
  stoa-workspace:
