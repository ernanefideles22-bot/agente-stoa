<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>STOA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue: #00d4ff;
  --glow: rgba(0,212,255,0.4);
  --deep: rgba(0,212,255,0.08);
}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Orbitron',sans-serif;color:var(--blue);touch-action:manipulation}

canvas#stars{position:fixed;inset:0;z-index:0}

/* ── Setup overlay ── */
#setup{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,0.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px
}
#setup.hidden{display:none}
#setup h2{font-size:.75rem;letter-spacing:.4em;opacity:.6;text-align:center}
#setup p{font-size:.55rem;letter-spacing:.2em;opacity:.35;text-align:center;max-width:300px;line-height:1.8}
.inp{
  background:transparent;border:1px solid var(--blue);color:var(--blue);
  padding:10px 16px;font-family:'Orbitron',sans-serif;font-size:.7rem;
  letter-spacing:.2em;width:min(300px,85vw);text-align:center;outline:none;border-radius:2px
}
.btn{
  background:transparent;border:1px solid var(--blue);color:var(--blue);
  padding:8px 28px;font-family:'Orbitron',sans-serif;font-size:.65rem;
  letter-spacing:.3em;cursor:pointer;transition:all .3s
}
.btn:hover,.btn:active{background:var(--deep);box-shadow:0 0 20px var(--glow)}

/* ── Scene ── */
#scene{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* ── Entity ── */
#entity-wrap{
  position:relative;
  width:min(320px,80vw);
  height:min(390px,75vh);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;-webkit-tap-highlight-color:transparent
}
#entity-wrap::before{
  content:'';position:absolute;width:120%;height:120%;
  background:radial-gradient(ellipse at center,rgba(0,100,200,.18) 0%,rgba(0,212,255,.06) 50%,transparent 75%);
  z-index:0;animation:breathe 5s ease-in-out infinite
}
@keyframes breathe{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
#entity-img{
  position:relative;z-index:1;width:100%;height:100%;object-fit:cover;border-radius:4px;
  filter:brightness(.9) contrast(1.1) saturate(1.2);transition:filter .6s;
  mask-image:radial-gradient(ellipse 80% 90% at center,black 55%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 80% 90% at center,black 55%,transparent 100%)
}
#eye-glow{
  position:absolute;z-index:2;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .8s;
  background:radial-gradient(ellipse 12% 3% at 37% 42%,rgba(0,212,255,.9),transparent),
             radial-gradient(ellipse 12% 3% at 63% 42%,rgba(0,212,255,.9),transparent);
  mix-blend-mode:screen
}
#scan{position:absolute;z-index:3;width:100%;height:2px;background:linear-gradient(to right,transparent,var(--blue),transparent);top:42%;opacity:0;pointer-events:none}

/* States */
body.listening #entity-img{filter:brightness(1.1) contrast(1.15) saturate(1.4)}
body.listening #eye-glow{opacity:1}
body.listening #entity-wrap::before{background:radial-gradient(ellipse at center,rgba(0,150,255,.3) 0%,rgba(0,212,255,.1) 50%,transparent 75%);animation:lp 1.5s ease-in-out infinite}
@keyframes lp{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
body.listening #scan{opacity:1;animation:sm 2s ease-in-out infinite}
@keyframes sm{0%{top:35%;opacity:0}20%{opacity:1}80%{opacity:1}100%{top:55%;opacity:0}}
body.thinking #entity-img{filter:brightness(.85) contrast(1.2) saturate(.8) hue-rotate(20deg)}
body.thinking #eye-glow{opacity:.6;animation:tb 1.8s ease-in-out infinite}
@keyframes tb{0%,100%{opacity:.3}50%{opacity:1}}
body.speaking #entity-img{filter:brightness(1.05) contrast(1.1) saturate(1.3)}
body.speaking #eye-glow{opacity:1;animation:sp .4s ease-in-out infinite}
@keyframes sp{0%,100%{opacity:.7}50%{opacity:1}}

/* ── Wave bars ── */
#wave{position:absolute;bottom:calc(50% - min(195px,37.5vh) - 36px);left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:flex-end;height:26px;opacity:0;transition:opacity .4s;z-index:5}
#wave.visible{opacity:1}
.wb{width:3px;background:var(--blue);border-radius:2px;animation:wa .6s ease-in-out infinite}
.wb:nth-child(1){animation-delay:0s;height:8px}
.wb:nth-child(2){animation-delay:.1s;height:14px}
.wb:nth-child(3){animation-delay:.2s;height:22px}
.wb:nth-child(4){animation-delay:.15s;height:18px}
.wb:nth-child(5){animation-delay:.05s;height:12px}
.wb:nth-child(6){animation-delay:.25s;height:8px}
.wb:nth-child(7){animation-delay:.1s;height:16px}
@keyframes wa{0%,100%{transform:scaleY(.4);opacity:.5}50%{transform:scaleY(1);opacity:1}}

/* ── Response ── */
#response{
  position:absolute;
  bottom:max(20px, env(safe-area-inset-bottom, 20px));
  left:50%;transform:translateX(-50%);
  width:min(680px,88vw);text-align:center;
  font-size:.72rem;letter-spacing:.1em;line-height:1.8;
  color:rgba(0,212,255,.85);opacity:0;transition:opacity 1s;
  pointer-events:none;z-index:5;
  text-shadow:0 0 20px rgba(0,212,255,.5);
  max-height:30vh;overflow:hidden
}
#response.visible{opacity:1}

/* ── Status ── */
#status{position:absolute;top:max(20px,env(safe-area-inset-top,20px));left:50%;transform:translateX(-50%);font-size:.55rem;letter-spacing:.4em;text-transform:uppercase;color:rgba(0,212,255,.4);opacity:0;transition:opacity .5s;z-index:5;white-space:nowrap}
#status.visible{opacity:1}

/* ── Device badge ── */
#device-badge{position:absolute;top:max(20px,env(safe-area-inset-top,20px));right:20px;font-size:.45rem;letter-spacing:.25em;color:rgba(0,212,255,.25);z-index:5}

/* ── Session badge ── */
#session-badge{position:absolute;top:max(36px,env(safe-area-inset-top,36px));left:50%;transform:translateX(-50%);font-size:.42rem;letter-spacing:.2em;color:rgba(0,212,255,.2);z-index:5;margin-top:12px}

/* ── Share button ── */
#share-btn{
  position:absolute;
  top:max(16px,env(safe-area-inset-top,16px));
  left:20px;
  z-index:5;
  background:transparent;border:1px solid rgba(0,212,255,.3);color:rgba(0,212,255,.5);
  padding:5px 12px;font-family:'Orbitron',sans-serif;font-size:.45rem;letter-spacing:.25em;
  cursor:pointer;border-radius:2px;transition:all .3s
}
#share-btn:hover{border-color:var(--blue);color:var(--blue);box-shadow:0 0 12px var(--glow)}

/* ── QR overlay ── */
#qr-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px
}
#qr-overlay.hidden{display:none}
#qr-overlay h3{font-size:.65rem;letter-spacing:.35em;opacity:.7}
#qr-box{background:#000;padding:16px;border:1px solid rgba(0,212,255,.3)}
#qr-url{font-size:.42rem;letter-spacing:.1em;opacity:.4;max-width:280px;text-align:center;word-break:break-all}
#qr-close{margin-top:8px}

/* ── Hint ── */
#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:.45rem;letter-spacing:.3em;color:rgba(0,212,255,.15);white-space:nowrap;z-index:5}

/* ── Circuits ── */
#circuits{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.1}

/* ── Tap ripple ── */
.ripple{position:fixed;border-radius:50%;border:1px solid var(--blue);pointer-events:none;z-index:10;animation:rippleAnim .8s ease-out forwards}
@keyframes rippleAnim{0%{width:0;height:0;opacity:.8;transform:translate(-50%,-50%)}100%{width:120px;height:120px;opacity:0;transform:translate(-50%,-50%)}}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<svg id="circuits" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <g stroke="#00d4ff" stroke-width=".8" fill="none" opacity=".6">
    <polyline points="0,200 120,200 140,220 300,220"/>
    <circle cx="140" cy="220" r="3" fill="#00d4ff"/>
    <polyline points="300,220 320,200 500,200 520,220 700,220"/>
    <polyline points="0,800 80,800 100,780 250,780 270,800 400,800"/>
    <circle cx="100" cy="780" r="3" fill="#00d4ff"/>
    <polyline points="1920,300 1800,300 1780,320 1600,320"/>
    <circle cx="1780" cy="320" r="3" fill="#00d4ff"/>
    <polyline points="1920,700 1820,700 1800,720 1650,720 1630,700 1500,700"/>
    <circle cx="1800" cy="720" r="3" fill="#00d4ff"/>
  </g>
</svg>

<!-- Setup -->
<div id="setup">
  <h2>STOA // CONFIGURAR ACESSO</h2>
  <p>cole a URL do túnel Cloudflare ou deixe vazio para acesso local</p>
  <input class="inp" id="inp-api" type="url" placeholder="https://xxxx.trycloudflare.com" autocomplete="off"/>
  <input class="inp" id="inp-token" type="password" placeholder="STOA_ACCESS_TOKEN" autocomplete="off"/>
  <input class="inp" id="inp-session" type="text" placeholder="stoa-shared (sessão compartilhada)" autocomplete="off"/>
  <button class="btn" id="btn-confirm">CONECTAR</button>
</div>

<!-- QR code overlay -->
<div id="qr-overlay" class="hidden">
  <h3>COMPARTILHAR COM MOBILE</h3>
  <div id="qr-box"><div id="qrcode"></div></div>
  <p id="qr-url"></p>
  <button class="btn" id="qr-close">FECHAR</button>
</div>

<!-- Scene -->

<script>
// ── Config ──────────────────────────────────────────────────────────────
let API_BASE = 'http://127.0.0.1:18000';
let ACCESS_TOKEN = '';
let SESSION_ID = 'stoa-shared';
const IS_MOBILE = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

// ── DOM ─────────────────────────────────────────────────────────────────
const body = document.body;
const setupEl = document.getElementById('setup');
const inpApi = document.getElementById('inp-api');
const inpToken = document.getElementById('inp-token');
const inpSession = document.getElementById('inp-session');
const btnConfirm = document.getElementById('btn-confirm');
const statusEl = document.getElementById('status');
const responseEl = document.getElementById('response');
const waveEl = document.getElementById('wave');
const entityWrap = document.getElementById('entity-wrap');
const shareBtn = document.getElementById('share-btn');
const qrOverlay = document.getElementById('qr-overlay');
const qrClose = document.getElementById('qr-close');
const deviceBadge = document.getElementById('device-badge');
const sessionBadge = document.getElementById('session-badge');

// ── Stars ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
function resizeC(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resizeC(); window.addEventListener('resize', resizeC);
function initStars(){
  stars=[];
  for(let i=0;i<200;i++) stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.2,a:Math.random()*.6+.1,s:Math.random()*.002+.001,p:Math.random()*Math.PI*2});
}
initStars();
function animStars(t){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    const a=s.a*(.5+.5*Math.sin(t*s.s*1000+s.p));
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(150,220,255,${a})`; ctx.fill();
  });
  requestAnimationFrame(animStars);
}
animStars(0);

// ── Tap ripple ───────────────────────────────────────────────────────────
function spawnRipple(x,y){
  const d=document.createElement('div');
  d.className='ripple'; d.style.left=x+'px'; d.style.top=y+'px';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),900);
}

// ── Load config ──────────────────────────────────────────────────────────
function loadConfig(){
  // Priority: URL hash > URL params > sessionStorage
  const hash = location.hash.replace('#','').trim();
  const params = new URLSearchParams(location.search);
  
  if(hash){ ACCESS_TOKEN = hash; }
  if(params.get('api')) API_BASE = params.get('api').replace(/\/$/,'');
  if(params.get('token')) ACCESS_TOKEN = params.get('token');
  if(params.get('session')) SESSION_ID = params.get('session');

  const stored = JSON.parse(sessionStorage.getItem('stoa_cfg')||'{}');
  if(!ACCESS_TOKEN && stored.token) ACCESS_TOKEN = stored.token;
  if(stored.api && API_BASE === 'http://127.0.0.1:18000') API_BASE = stored.api;
  if(stored.session) SESSION_ID = stored.session;

  if(ACCESS_TOKEN){
    setupEl.classList.add('hidden');
    deviceBadge.textContent = IS_MOBILE ? 'MOBILE' : 'DESKTOP';
    sessionBadge.textContent = 'SESSION · ' + SESSION_ID;
    shareBtn.style.display = IS_MOBILE ? 'none' : '';
  }
}
loadConfig();

// ── Setup confirm ────────────────────────────────────────────────────────
btnConfirm.addEventListener('click',()=>{
  const api = inpApi.value.trim() || 'http://127.0.0.1:18000';
  const tok = inpToken.value.trim();
  const ses = inpSession.value.trim() || 'stoa-shared';
  if(!tok){ inpToken.style.borderColor='red'; return; }
  API_BASE = api.replace(/\/$/,'');
  ACCESS_TOKEN = tok;
  SESSION_ID = ses;
  sessionStorage.setItem('stoa_cfg', JSON.stringify({api:API_BASE, token:tok, session:ses}));
  setupEl.classList.add('hidden');
  deviceBadge.textContent = IS_MOBILE ? 'MOBILE' : 'DESKTOP';
  sessionBadge.textContent = 'SESSION · ' + SESSION_ID;
  shareBtn.style.display = IS_MOBILE ? 'none' : '';
});
inpToken.addEventListener('keydown',e=>{ if(e.key==='Enter') btnConfirm.click(); });

// ── QR Code share ────────────────────────────────────────────────────────
shareBtn.addEventListener('click',()=>{
  const shareUrl = `${API_BASE}/stoa_remote.html?api=${encodeURIComponent(API_BASE)}&token=${encodeURIComponent(ACCESS_TOKEN)}&session=${encodeURIComponent(SESSION_ID)}`;
  document.getElementById('qr-url').textContent = shareUrl;
  document.getElementById('qrcode').innerHTML = '';
  new QRCode(document.getElementById('qrcode'),{
    text: shareUrl,
    width: 200, height: 200,
    colorDark: '#00d4ff', colorLight: '#000000',
    correctLevel: QRCode.CorrectLevel.M
  });
  qrOverlay.classList.remove('hidden');
});
qrClose.addEventListener('click',()=> qrOverlay.classList.add('hidden'));

// ── State ─────────────────────────────────────────────────────────────────
let state='idle';
let recognition=null;
let respTimeout=null;

function setState(s){
  state=s;
  body.classList.remove('idle','listening','thinking','speaking');
  body.classList.add(s);
  const labels={idle:'',listening:'ouvindo',thinking:'processando',speaking:'respondendo'};
  const lbl=labels[s];
  if(lbl){ statusEl.textContent=lbl; statusEl.classList.add('visible'); }
  else statusEl.classList.remove('visible');
  waveEl.classList.toggle('visible', s==='listening');
}

// ── Response ──────────────────────────────────────────────────────────────
function showResponse(text){
  if(respTimeout) clearTimeout(respTimeout);
  responseEl.textContent=''; responseEl.classList.remove('visible');
  setState('speaking');
  let i=0;
  const iv=setInterval(()=>{
    if(i<text.length){ responseEl.textContent+=text[i++]; responseEl.classList.add('visible'); }
    else{
      clearInterval(iv);
      respTimeout=setTimeout(()=>{ responseEl.classList.remove('visible'); setTimeout(()=>setState('idle'),1000); },7000);
    }
  },20);
}

// ── API ────────────────────────────────────────────────────────────────────
async function sendCommand(text){
  setState('thinking');
  try{
    const res = await fetch(`${API_BASE}/api/orchestrate`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${ACCESS_TOKEN}`},
      body:JSON.stringify({command:text, session_id:SESSION_ID})
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const reply = data.result||data.response||data.output||data.message||JSON.stringify(data).slice(0,300);
    showResponse(reply);
    // TTS
    if('speechSynthesis' in window){
      const utt=new SpeechSynthesisUtterance(reply);
      utt.lang='pt-BR'; utt.rate=0.95;
      speechSynthesis.speak(utt);
    }
  }catch(err){
    showResponse('Sem resposta do sistema. Verifique o túnel ou o token.');
    setTimeout(()=>setState('idle'),4000);
  }
}

// ── Speech ─────────────────────────────────────────────────────────────────
function startListening(){
  if(state!=='idle'){ stopListening(); return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ showResponse('Reconhecimento de voz não disponível. Use Chrome ou Safari no iOS 15+.'); return; }
  recognition=new SR();
  recognition.lang='pt-BR'; recognition.interimResults=false; recognition.maxAlternatives=1;
  recognition.onstart=()=>setState('listening');
  recognition.onresult=e=>{ sendCommand(e.results[0][0].transcript); };
  recognition.onerror=e=>{ if(e.error!=='aborted') showResponse('Não ouvi nada. Toque novamente.'); setState('idle'); };
  recognition.onend=()=>{ if(state==='listening') setState('idle'); };
  recognition.start();
}
function stopListening(){ if(recognition){recognition.abort();recognition=null;} setState('idle'); }

// ── Touch/Click ────────────────────────────────────────────────────────────
entityWrap.addEventListener('click',e=>{
  if(!setupEl.classList.contains('hidden')) return;
  spawnRipple(e.clientX, e.clientY);
  if(state==='idle') startListening();
  else if(state==='listening') stopListening();
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!e.repeat){ e.preventDefault(); if(state==='idle') startListening(); else if(state==='listening') stopListening(); }
  if(e.code==='Escape') stopListening();
});
</script>
